<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellaship Brain</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="titlebar">
        <div class="titlebar-title">Fellaship Brain</div>
        <div class="titlebar-actions">
          <button class="icon-btn" id="btn-new" title="Nová myšlenka (⌘N)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M7 2v10M2 7h10"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="Nastavení (⌘,)">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="7" r="2.2"/>
              <path d="M7 1v1.8M7 11.2V13M13 7h-1.8M2.8 7H1M11.2 2.8l-1.3 1.3M4.1 9.9l-1.3 1.3M11.2 11.2l-1.3-1.3M4.1 4.1 2.8 2.8"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="body">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-section-title">Přehled</div>
            <div class="sidebar-item active" data-filter="all">
              <span class="bullet bullet--napad"></span> Vše <span class="count" id="count-all">0</span>
            </div>
            <div class="sidebar-item" data-filter="consulted">
              <span>🧠</span> Konzultováno <span class="count" id="count-consulted">0</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">Kategorie</div>
            <div class="sidebar-item" data-filter="cat:napad">
              <span class="bullet bullet--napad"></span> Nápady <span class="count" id="count-napad">0</span>
            </div>
            <div class="sidebar-item" data-filter="cat:popis_napadu">
              <span class="bullet bullet--popis"></span> Rozpracování <span class="count" id="count-popis_napadu">0</span>
            </div>
            <div class="sidebar-item" data-filter="cat:klient_oblast">
              <span class="bullet bullet--klient"></span> Klient / oblast <span class="count" id="count-klient_oblast">0</span>
            </div>
            <div class="sidebar-item" data-filter="cat:pripominka">
              <span class="bullet bullet--pripominka"></span> Připomínky <span class="count" id="count-pripominka">0</span>
            </div>
            <div class="sidebar-item" data-filter="cat:jine">
              <span class="bullet bullet--jine"></span> Jiné <span class="count" id="count-jine">0</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">Status</div>
            <div class="sidebar-item" data-filter="status:open">Otevřené</div>
            <div class="sidebar-item" data-filter="status:done">Hotové</div>
          </div>
        </aside>

        <div class="main">
          <div class="search-row">
            <input
              type="text"
              id="search"
              class="search-input"
              placeholder="Hledej v myšlenkách…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="list" id="list">
            <div class="empty" id="empty">
              <div class="empty-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M10 2v2M10 16v2M4 10H2M18 10h-2M5.6 5.6l-1.4-1.4M15.8 15.8l-1.4-1.4M5.6 14.4l-1.4 1.4M15.8 4.2l-1.4 1.4"/>
                  <circle cx="10" cy="10" r="3"/>
                </svg>
              </div>
              <div class="empty-title">Zatím žádné myšlenky</div>
              <div class="empty-desc">
                Stiskni <span class="kbd">⌘</span><span class="kbd">⇧</span><span class="kbd">Space</span> odkudkoli
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="drawer" id="drawer">
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <div class="drawer-panel">
        <div class="drawer-header">
          <div class="drawer-title" id="d-title"></div>
          <div class="drawer-chips" id="d-chips"></div>
        </div>
        <div class="drawer-body">
          <div class="drawer-section">
            <div class="drawer-section-label">Co s tím</div>
            <div class="drawer-description" id="d-description"></div>
          </div>
          <div class="drawer-section" id="d-prompt-wrap">
            <div class="drawer-section-label">🧠 Prompt pro konzultaci</div>
            <div class="drawer-prompt" id="d-prompt"></div>
          </div>
          <div class="drawer-section">
            <div class="drawer-section-label">Raw</div>
            <div class="drawer-raw" id="d-raw"></div>
          </div>
        </div>
        <div class="drawer-footer">
          <button class="btn btn--primary" id="d-consult">
            🧠 Konzultuj s Claudem
          </button>
          <button class="btn" id="d-copy">Kopíruj prompt</button>
          <button class="btn" id="d-done">Hotovo</button>
          <button class="btn btn--danger" id="d-delete">Smazat</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/scripts/main.ts"></script>
  </body>
</html>
